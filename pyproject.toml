[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coloph-db"
version = "0.1.2"
description = "Explicit transaction lifecycle and execution hooks for psycopg applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "golergka"}]
dependencies = ["psycopg>=3.3.2,<4"]
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.3.2,<4"]

[project.urls]
Repository = "https://github.com/golergka/coloph-db"
Issues = "https://github.com/golergka/coloph-db/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "psycopg[binary]>=3.3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/coloph_db"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/coloph_db", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
asyncio_mode = "auto"
addopts = "-ra"
